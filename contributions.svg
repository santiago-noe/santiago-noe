<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .grid { fill: #21262d; }
      .green { fill: #2ea043; }
      .green2 { fill: #1f6f3a; }
      .green3 { fill: #0f7b61; }
      .text { fill: #c9d1d9; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; }
      .sub { fill: #8b949e; font-family: Arial, Helvetica, sans-serif; font-size: 12px; }
      .wormBody { fill: #9be15d; stroke: #69b446; stroke-width: 2; }
      .wormHead { fill: #69b446; stroke: #9be15d; stroke-width: 2; }
      .eye { fill: #ffffff; }
      .leg { fill: #2ea043; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="260" rx="8" />

  <!-- panel -->
  <rect class="panel" x="20" y="30" width="860" height="180" rx="10" />

  <!-- title -->
  <text class="text" x="50" y="62">101 contributions in the last year</text>
  <text class="sub" x="50" y="88">Developer activity</text>

  <!-- grid of contribution squares -->
  <g opacity="0.95">
    <!-- Place the grid along the panel -->
    <rect class="grid" x="50" y="105" width="10" height="10" rx="2" />
    <rect class="grid" x="70" y="105" width="10" height="10" rx="2" />
    <rect class="grid" x="90" y="105" width="10" height="10" rx="2" />
    <rect class="grid" x="110" y="105" width="10" height="10" rx="2" />
    <rect class="green2" x="130" y="105" width="10" height="10" rx="2" />
    <rect class="green" x="150" y="105" width="10" height="10" rx="2" />
    <rect class="green3" x="170" y="105" width="10" height="10" rx="2" />
    <rect class="grid" x="190" y="105" width="10" height="10" rx="2" />

    <rect class="grid" x="50" y="125" width="10" height="10" rx="2" />
    <rect class="green" x="70" y="125" width="10" height="10" rx="2" />
    <rect class="green3" x="90" y="125" width="10" height="10" rx="2" />
    <rect class="grid" x="110" y="125" width="10" height="10" rx="2" />
    <rect class="green" x="130" y="125" width="10" height="10" rx="2" />
    <rect class="grid" x="150" y="125" width="10" height="10" rx="2" />
    <rect class="green2" x="170" y="125" width="10" height="10" rx="2" />
    <rect class="grid" x="190" y="125" width="10" height="10" rx="2" />

    <rect class="grid" x="50" y="145" width="10" height="10" rx="2" />
    <rect class="green2" x="70" y="145" width="10" height="10" rx="2" />
    <rect class="grid" x="90" y="145" width="10" height="10" rx="2" />
    <rect class="green" x="110" y="145" width="10" height="10" rx="2" />
    <rect class="green3" x="130" y="145" width="10" height="10" rx="2" />
    <rect class="green2" x="150" y="145" width="10" height="10" rx="2" />
    <rect class="grid" x="170" y="145" width="10" height="10" rx="2" />
    <rect class="green" x="190" y="145" width="10" height="10" rx="2" />

    <rect class="green3" x="260" y="105" width="10" height="10" rx="2" />
    <rect class="green" x="280" y="105" width="10" height="10" rx="2" />
    <rect class="grid" x="300" y="105" width="10" height="10" rx="2" />
    <rect class="green2" x="320" y="105" width="10" height="10" rx="2" />
    <rect class="green3" x="340" y="105" width="10" height="10" rx="2" />
    <rect class="grid" x="360" y="105" width="10" height="10" rx="2" />
    <rect class="green" x="380" y="105" width="10" height="10" rx="2" />

    <rect class="grid" x="260" y="125" width="10" height="10" rx="2" />
    <rect class="green2" x="280" y="125" width="10" height="10" rx="2" />
    <rect class="green" x="300" y="125" width="10" height="10" rx="2" />
    <rect class="grid" x="320" y="125" width="10" height="10" rx="2" />
    <rect class="green" x="340" y="125" width="10" height="10" rx="2" />
    <rect class="grid" x="360" y="125" width="10" height="10" rx="2" />
    <rect class="green3" x="380" y="125" width="10" height="10" rx="2" />

    <rect class="grid" x="260" y="145" width="10" height="10" rx="2" />
    <rect class="green" x="280" y="145" width="10" height="10" rx="2" />
    <rect class="green3" x="300" y="145" width="10" height="10" rx="2" />
    <rect class="green2" x="320" y="145" width="10" height="10" rx="2" />
    <rect class="grid" x="340" y="145" width="10" height="10" rx="2" />
    <rect class="green" x="360" y="145" width="10" height="10" rx="2" />
    <rect class="grid" x="380" y="145" width="10" height="10" rx="2" />

    <rect class="green3" x="460" y="105" width="10" height="10" rx="2" />
    <rect class="grid" x="480" y="105" width="10" height="10" rx="2" />
    <rect class="green" x="500" y="105" width="10" height="10" rx="2" />
    <rect class="green" x="520" y="105" width="10" height="10" rx="2" />
    <rect class="grid" x="540" y="105" width="10" height="10" rx="2" />
    <rect class="green2" x="560" y="105" width="10" height="10" rx="2" />
    <rect class="green3" x="580" y="105" width="10" height="10" rx="2" />

    <rect class="green" x="460" y="125" width="10" height="10" rx="2" />
    <rect class="grid" x="480" y="125" width="10" height="10" rx="2" />
    <rect class="green2" x="500" y="125" width="10" height="10" rx="2" />
    <rect class="green" x="520" y="125" width="10" height="10" rx="2" />
    <rect class="grid" x="540" y="125" width="10" height="10" rx="2" />
    <rect class="green3" x="560" y="125" width="10" height="10" rx="2" />
    <rect class="grid" x="580" y="125" width="10" height="10" rx="2" />

    <rect class="green2" x="460" y="145" width="10" height="10" rx="2" />
    <rect class="green3" x="480" y="145" width="10" height="10" rx="2" />
    <rect class="grid" x="500" y="145" width="10" height="10" rx="2" />
    <rect class="green" x="520" y="145" width="10" height="10" rx="2" />
    <rect class="green2" x="540" y="145" width="10" height="10" rx="2" />
    <rect class="grid" x="560" y="145" width="10" height="10" rx="2" />
    <rect class="green" x="580" y="145" width="10" height="10" rx="2" />
  </g>

  <!-- progress bar line -->
  <rect class="green3" x="50" y="175" width="280" height="4" rx="3" />

  <!-- little walking caterpillar / gusanito -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0; 240 0; 0 0" dur="4s" repeatCount="indefinite" />
    <ellipse class="green2" cx="620" cy="165" rx="9" ry="8" />
    <ellipse class="wormBody" cx="630" cy="165" rx="12" ry="11" />
    <ellipse class="wormBody" cx="644" cy="165" rx="11" ry="10" />
    <ellipse class="wormBody" cx="656" cy="165" rx="10" ry="9" />
    <ellipse class="wormHead" cx="666" cy="165" rx="12" ry="11" />
    <circle class="eye" cx="671" cy="162" r="2" />
    <circle class="eye" cx="669" cy="167" r="2" />
    <line class="leg" x1="628" y1="176" x2="624" y2="183" stroke-width="2" />
    <line class="leg" x1="634" y1="176" x2="632" y2="184" stroke-width="2" />
    <line class="leg" x1="648" y1="176" x2="646" y2="184" stroke-width="2" />
    <line class="leg" x1="657" y1="176" x2="655" y2="184" stroke-width="2" />
  </g>

  <!-- bottom text green: reliability note -->
  <text class="sub" x="360" y="205">Reliability isn’t a feature — it’s a prerequisite</text>
</svg>
